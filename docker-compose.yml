# The stack `primer-panel` of primer.yaml. The machine names the compose project
# (-p) and passes the stack's env with --env-file; every variable below is
# required, ${VAR:?} (contract 3 rule 18).

services:
  app:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://panel:${POSTGRES_PASSWORD:?}@postgres:5432/panel
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      EDITION: ${EDITION:?}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
    environment:
      API_BASE_URL: ${API_BASE_URL:?}
      LANGUAGES: ${LANGUAGES:?}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:?}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/config.json"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_USER: panel
      POSTGRES_DB: panel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "panel", "-d", "panel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Sessions, limits and other short-lived state of the app: nothing kept
  # on disk -- a restart empties it (no RDB snapshots, no AOF).
  redis:
    image: redis:7.4.11-alpine3.21@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    # The password reaches redis-server and redis-cli from the environment,
    # never from a file of the host.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    healthcheck:
      test: ["CMD-SHELL", "export REDISCLI_AUTH=$$REDIS_PASSWORD; redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata: {}
