schema: 1
name: primer-panel                    # the name of its repository (contract 3 rule 32)
kind: product

dependencies:                         # services on the Panel's box; the exact version -- primer.lock
  # comms (DM-160): it signs people in through Telegram for the Panel (the
  # option login) and is the Panel's way to them (telegram). Its profile is data
  # of the machine (form D, protocol 4.5): this repository's comms-profile/,
  # checked by `comms validate --profile` before comms takes it.
  comms: { repo: git@github.com:aivis-one/comms.git, version: ">=4.3,<5", data: { profile: comms-profile } }

editions:                             # the backend checks the passport's choice again at start (rule 11)
  core: { services: [comms] }

# The instance's options (contract 3 rules 36-38). Both required: without the
# sign-in through comms the Panel lets no one in, and the sign-in is the bot's
# (comms refuses login without telegram).
options: [telegram, login]
options_required: [telegram, login]

languages: [en, ru]                   # every language the product has: its built-in texts

stacks:
  primer-panel:                       # the stack's own entry: named as the stack
    compose: docker-compose.yml
    app:      { service: app, port: 8000, health: /health, ready: /ready }
    frontend: { service: frontend, port: 80 }
    migrate:  python -m alembic upgrade head
    # No `test`: the Panel's unit tests run in its own CI (the owner's
    # decision of 22.11); a box tests nothing of it.
  panel-storage:                      # the Panel's object storage (DM-203): RustFS
    compose: docker-compose.storage.yml
    persistent: true                  # its volume survives destroy and reinstall (rule 14)
    # Its point: for comms (PRODUCT_STORAGE_ADDRESS) and, once it has a
    # client, for the Panel's app -- one alias for both (contract 3 1.27).
    # `scheme` tells the machine what it is, not the address.
    expose:
      files: { service: panel-storage, port: 9000, scheme: http }

env:
  POSTGRES_PASSWORD: { source: minted }
  REDIS_PASSWORD:    { source: minted }
  EDITION:           { source: passport, key: edition, enum: editions }
  API_BASE_URL:      { source: passport, key: domains.api }
  LANGUAGES:         { source: passport, key: languages }          # the instance's, by commas
  DEFAULT_LANGUAGE:  { source: passport, key: default_language }
  SUPERADMIN_TELEGRAM_ID: { source: param }                      # the Panel's one superadmin
  DOMAIN_FRONTEND:   { source: passport, key: domains.frontend }  # where sign-in sends the browser back
  DOMAIN_API:        { source: passport, key: domains.api }       # the return address of sign-in
  # primer-ops, the passports of the boxes (DM-158): its address, the write
  # key and the Panel's age key -- the two keys files, never variables
  OPS_REPO:          { source: param }                             # ssh://git@ssh.github.com:443/<owner>/<repo>.git
  OPS_WRITE_KEY:     { source: asked, file: { path: /run/panel/ops-write.key } }
  # comms' sign-in module (DM-160): the address of its API and the token the
  # Panel presents -- seams of comms; app/seams.py names them (TAKES)
  COMMS_API_URL:       { source: seam, from: comms }
  COMMS_SERVICE_TOKEN: { source: seam, from: comms }
  OPS_AGE_KEY:       { source: asked, file: { path: /run/panel/ops-age.key } }
  # The storage's root SECRET (DM-203): exactly 40 characters, as velo's --
  # RustFS takes a secret of 8..40, and a minted value is minted once. Its
  # login is a constant of docker-compose.storage.yml.
  RUSTFS_SECRET_KEY: { source: minted, length: 40 }

provides:                             # what the Panel gives the services on its box
  # The point of its object storage, `<alias>:<port>` -- comms v4.2.0 asks it
  # of every product whatever the options (its requires; section 15 of its
  # INTEGRATION.md). The machine's value: panel-storage-panel-storage:9000.
  PRODUCT_STORAGE_ADDRESS: { stack: panel-storage, endpoint: files }

egress:                               # the way out of the Panel's container (DM-146, DM-158)
  - ssh.github.com                    # git over ssh to primer-ops, port 443

host:
  domains: [frontend, api]
  routes:
    frontend: { to: "frontend:80" }
    api:
      to: "app:8000"
      max_body: 1M
      paths:
        # the stream of a run's lines (SSE, DM-156): passed on as it comes;
        # a keepalive every 15 s keeps the read under 120 s
        /api/v1/streams/: { read_timeout: 120s, buffering: false }

report: { health: /health, ready: /ready, logs: json, junit: false }
